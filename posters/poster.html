<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QST Grand Opening Poster</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1b2a52; --ink-soft: #4d5a80; --crimson: #a3122e; --line: rgba(27,42,82,.22); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #eaf1fb; }
    body { font-family: "Montserrat", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

    .poster { position: relative; width: 100vw; height: 100vh; overflow: hidden; text-align: center; }

    /* sky colour behind the photo, matched to its top edge */
    .bg { position: absolute; inset: 0; background: linear-gradient(90deg, #f3f6fb 0%, #e6eef8 50%, #c9dcf1 100%); }
    /* the photo: enlarged, peak centred, contrast lifted so the mountains read */
    .bg::before {
      content: ""; position: absolute; inset: 0;
      background: url("../assets/bg.jpg") var(--bg-pos) / var(--bg-size) no-repeat;
      filter: brightness(.8) contrast(1.35) saturate(1.35);
      -webkit-mask-image: linear-gradient(to bottom, transparent var(--fade), #000 calc(var(--fade) + 24%));
      mask-image: linear-gradient(to bottom, transparent var(--fade), #000 calc(var(--fade) + 24%));
    }
    /* light wash only at the very top (text) and bottom (address) */
    .bg::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 78%, rgba(255,255,255,.75) 100%);
    }
    .frame { position: absolute; inset: var(--inset); border: 1px solid rgba(27,42,82,.16); pointer-events: none; }

    .content {
      position: relative; height: 100%;
      display: flex; flex-direction: column; align-items: center;
      padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
    }
    .logo { width: var(--logo); height: auto; display: block; }
    .eyebrow { margin-top: calc(var(--u) * 2.4); font-size: calc(var(--u) * .95); font-weight: 600; letter-spacing: .45em; text-transform: uppercase; color: var(--ink-soft); }
    h1 {
      margin-top: calc(var(--u) * .5);
      font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500;
      font-size: calc(var(--u) * 5.6); line-height: 1; letter-spacing: -.01em;
    }
    .rule { width: calc(var(--u) * 3.6); height: 2px; background: var(--crimson); opacity: .8; margin: calc(var(--u) * 1.7) auto calc(var(--u) * 1.5); }
    .event { font-size: calc(var(--u) * 1.15); font-weight: 600; letter-spacing: .34em; text-transform: uppercase; color: var(--crimson); }
    .date {
      margin-top: calc(var(--u) * .5);
      font-family: "Cormorant Garamond", serif; font-weight: 600;
      font-size: calc(var(--u) * 3.1); line-height: 1.05; letter-spacing: .06em; text-transform: uppercase;
      font-variant-numeric: lining-nums;
    }
    .tagline {
      margin-top: calc(var(--u) * 1.3);
      max-width: calc(var(--u) * 34); text-wrap: balance;
      font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500;
      font-size: calc(var(--u) * 1.85); line-height: 1.3; color: var(--ink);
    }
    .spacer { flex: 1; }
    .address {
      width: 100%; padding-top: calc(var(--u) * 1.4); border-top: 1px solid var(--line);
      display: inline-flex; justify-content: center; align-items: center; gap: calc(var(--u) * .6);
      font-size: calc(var(--u) * 1.15); font-weight: 500; letter-spacing: .06em;
    }
    .address svg { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); fill: none; stroke: var(--crimson); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ---- formats (set by ?f=) ---- */
    .square   { --u: 11.5px; --inset: 32px; --pad-top: 70px;  --pad-x: 80px; --pad-bottom: 62px;
                --logo: 200px; --bg-size: auto 78%; --bg-pos: 92% bottom; --fade: 22%; }
    .portrait { --u: 12.5px; --inset: 34px; --pad-top: 90px;  --pad-x: 80px; --pad-bottom: 70px;
                --logo: 230px; --bg-size: auto 76%; --bg-pos: 88% bottom; --fade: 24%; }
    .story    { --u: 14px;   --inset: 42px; --pad-top: 200px; --pad-x: 80px; --pad-bottom: 170px;
                --logo: 290px; --bg-size: auto 72%; --bg-pos: 78% bottom; --fade: 28%; }
    .story .eyebrow { margin-top: calc(var(--u) * 3.4); }
    .wide     { --u: 8px;    --inset: 22px; --pad-top: 40px;  --pad-x: 80px; --pad-bottom: 32px;
                --logo: 150px; --bg-size: 100% auto; --bg-pos: center bottom; --fade: 0%; }
    .wide .eyebrow { margin-top: calc(var(--u) * 1.8); }
    .wide .rule { margin: calc(var(--u) * 1.2) auto calc(var(--u) * 1.1); }
    .wide .tagline { margin-top: calc(var(--u) * 1); }
  </style>
</head>
<body>
  <div class="poster" id="poster">
    <div class="bg"></div>
    <div class="frame"></div>
    <div class="content">
      <img class="logo" src="../assets/qst-logo.png" alt="QST Training Center">
      <p class="eyebrow">Kathmandu · Nepal</p>
      <h1>A New Chapter Begins</h1>
      <div class="rule"></div>
      <p class="event">Grand Opening</p>
      <p class="date">13 November 2026</p>
      <p class="tagline">Bringing International Training Excellence to Nepal</p>
      <div class="spacer"></div>
      <p class="address"><svg viewBox="0 0 24 24"><path d="M12 22s-8-6.5-8-12a8 8 0 0 1 16 0c0 5.5-8 12-8 12z"/><circle cx="12" cy="10" r="3"/></svg>Gahana Pokhari, Naxal, Kathmandu</p>
    </div>
  </div>
  <script>
    document.getElementById("poster").classList.add(new URLSearchParams(location.search).get("f") || "square");
  </script>
</body>
</html>
