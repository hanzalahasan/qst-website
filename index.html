<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QST Training Center | Coming Soon</title>
  <meta name="description" content="QST Training Center is opening soon in Gahana Pokhari, Naxal, Kathmandu. Grand opening on Friday, 13 November 2026.">
  <meta property="og:title" content="QST Training Center | Coming Soon">
  <meta property="og:description" content="Grand opening on Friday, 13 November 2026 at Gahana Pokhari, Naxal, Kathmandu.">
  <meta property="og:image" content="assets/qst-logo.png">
  <meta property="og:url" content="https://qst.com.np">
  <meta name="theme-color" content="#eaf1fb">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1b2a52;
      --ink-soft: #5a678a;
      --line: rgba(27, 42, 82, .18);
      --crimson: #a3122e;
      --sky: #eaf1fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--sky);
      color: var(--ink);
      font-family: "Montserrat", system-ui, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: url("assets/bg.jpg") center 70% / cover no-repeat;
      animation: drift 40s ease-in-out infinite alternate;
    }
    /* gentle wash so text over the sky stays crisp */
    .bg::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.15) 55%, rgba(255,255,255,0) 75%, rgba(255,255,255,.45) 100%);
    }
    @keyframes drift { from { transform: scale(1); } to { transform: scale(1.06); } }

    .page {
      position: relative; z-index: 1;
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 16px;
      text-align: center;
    }

    .hero {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8vh 0 6vh;
      max-width: 720px;
    }

    .logo { width: min(210px, 52vw); height: auto; display: block; }

    .eyebrow {
      margin-top: 44px;
      font-size: .72rem; font-weight: 500;
      letter-spacing: .42em; text-transform: uppercase;
      color: var(--ink-soft);
    }
    h1 {
      margin-top: 10px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic; font-weight: 400;
      font-size: clamp(3.2rem, 11vw, 6.2rem);
      line-height: 1;
      letter-spacing: -.01em;
      color: var(--ink);
    }

    .rule { width: 48px; height: 1px; background: var(--crimson); margin: 30px auto 26px; opacity: .7; }

    .event {
      font-size: .78rem; font-weight: 500;
      letter-spacing: .28em; text-transform: uppercase;
      color: var(--crimson);
    }
    .date {
      margin-top: 10px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.5rem, 4.6vw, 2rem);
      font-variant-numeric: lining-nums;
      font-weight: 400;
      color: var(--ink);
    }

    .countdown {
      margin-top: 34px;
      display: flex; justify-content: center; align-items: flex-start;
      gap: clamp(18px, 5vw, 44px);
    }
    .unit { min-width: 52px; }
    .unit b {
      display: block;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 7vw, 2.8rem);
      line-height: 1;
      font-variant-numeric: lining-nums tabular-nums;
    }
    .unit small {
      display: block; margin-top: 8px;
      font-size: .62rem; font-weight: 500;
      letter-spacing: .3em; text-transform: uppercase;
      color: var(--ink-soft);
    }
    .sep { font-family: "Cormorant Garamond", serif; font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.1; color: var(--line); }
    .launched { display: none; margin-top: 30px; font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.6rem; }

    footer {
      width: 100%; max-width: 980px;
      padding: 22px 0 28px;
      border-top: 1px solid var(--line);
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 10px 34px;
      font-size: .8rem; font-weight: 400; letter-spacing: .06em;
    }
    footer a { color: var(--ink); text-decoration: none; transition: color .2s; }
    footer a:hover { color: var(--crimson); }

    /* soft entrance */
    .hero > *, footer { opacity: 0; transform: translateY(10px); animation: rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
    .hero > :nth-child(2) { animation-delay: .15s; }
    .hero > :nth-child(3) { animation-delay: .25s; }
    .hero > :nth-child(4) { animation-delay: .35s; }
    .hero > :nth-child(5) { animation-delay: .45s; }
    .hero > :nth-child(6) { animation-delay: .55s; }
    .hero > :nth-child(7) { animation-delay: .65s; }
    footer { animation-delay: .8s; }
    @keyframes rise { to { opacity: 1; transform: none; } }

    @media (max-width: 600px) {
      .bg { background-position: 62% 70%; }
      .eyebrow { margin-top: 34px; letter-spacing: .32em; }
      .sep { display: none; }
      footer { flex-direction: column; gap: 8px; font-size: .78rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bg, .hero > *, footer { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="page">
    <main class="hero">
      <img class="logo" src="assets/qst-logo.png" alt="QST Training Center" width="1100" height="617">
      <p class="eyebrow">Kathmandu · Nepal</p>
      <h1>Coming Soon</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="event">Grand Opening Ceremony</p>
      <p class="date">Friday, 13 November 2026</p>
      <div class="countdown" id="countdown" role="timer">
        <div class="unit"><b id="d">00</b><small>Days</small></div>
        <span class="sep" aria-hidden="true">·</span>
        <div class="unit"><b id="h">00</b><small>Hours</small></div>
        <span class="sep" aria-hidden="true">·</span>
        <div class="unit"><b id="m">00</b><small>Min</small></div>
        <span class="sep" aria-hidden="true">·</span>
        <div class="unit"><b id="s">00</b><small>Sec</small></div>
      </div>
      <p class="launched" id="launched">We are now open. Welcome.</p>
    </main>

    <footer>
      <a href="tel:+9779740740309">+977 9740740309</a>
      <a href="mailto:info@qst.com.np">info@qst.com.np</a>
      <a href="https://www.google.com/maps/search/?api=1&query=Gahana+Pokhari%2C+Naxal%2C+Kathmandu" target="_blank" rel="noopener">Gahana Pokhari, Naxal, Kathmandu</a>
    </footer>
  </div>

  <script>
    // Opening: Friday 13 Nov 2026, start of day Nepal time (UTC+05:45)
    const OPENING = new Date("2026-11-13T00:00:00+05:45").getTime();
    const pad = n => String(n).padStart(2, "0");
    const els = ["d", "h", "m", "s"].map(id => document.getElementById(id));
    function tick() {
      const diff = OPENING - Date.now();
      if (diff <= 0) {
        document.getElementById("countdown").style.display = "none";
        document.getElementById("launched").style.display = "block";
        return;
      }
      [Math.floor(diff / 864e5), Math.floor(diff / 36e5) % 24, Math.floor(diff / 6e4) % 60, Math.floor(diff / 1e3) % 60]
        .forEach((v, i) => { els[i].textContent = pad(v); });
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }
    tick();
  </script>
</body>
</html>
